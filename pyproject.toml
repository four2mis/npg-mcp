[project]
name = "npg-mcp"
version = "0.2.3"
description = "MCP server for NginxProxyGuard API management"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.29.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["npg_mcp*"]
