npg_list_proxy_hosts:
  description: "List all proxy hosts. Returns a list of proxy host objects."
  parameters: []

npg_get_proxy_host:
  description: "Get a single proxy host by its ID. REQUIRED: host_id."
  parameters:
    - name: host_id
      type: integer | string
      required: true

npg_get_proxy_host_by_domain:
  description: "Get a proxy host by its domain name."
  parameters:
    - name: domain
      type: string
      required: true

npg_create_proxy_host:
  description: "Create a new reverse proxy host. Required: domain_names (array), forward_host, forward_port. Optional: pass only the fields you want to change; omitted fields inherit global defaults or sensible built-in defaults. Fields: proxy_type (default 'http'), forward_scheme (default 'http'), enabled (default True), ssl_enabled, ssl_forced (default True), ssl_http2 (default True), ssl_http3, ssl_cert_id, waf_enabled, waf_use_global (default True), waf_paranoia_level, waf_anomaly_threshold, waf_mode, cache_enabled, cache_static_only, cache_ttl, cache_template, block_normal, block_http, block_exploits (default True), block_exploits_exceptions, allow_websocket_upgrade (default True), enable_proxy_headers, host_header, extra_domains, advanced_config, proxy_buffering (str), proxy_request_buffering (str), client_max_body_size (str), proxy_max_temp_file_size (str), proxy_connect/send/read_timeout, access_list_id, auth_provider_id, auth_bypass_paths, ddns_enabled/provider_id/proxied, forward_container_name/network, stream_* fields."
  parameters: []

npg_update_proxy_host:
  description: "Update an existing proxy host (partial update — pass only the fields you want to change; omitted fields are left as-is). Use `skip_nginx=true` to skip nginx regeneration. Fields: domain_names, forward_host, forward_port, forward_scheme, block_normal, waf_enabled, waf_use_global (bool | None — tri-state: omit=leave unchanged, false=host own WAF config, true=inherit global WAF), waf_paranoia_level, waf_anomaly_threshold, block_http, ssl_forced, ssl_cert_id, cache_enabled, cache_static_only, cache_ttl (str), cache_template, advanced_config, enable_proxy_headers, host_header, extra_domains, enabled, ssl_http2, ssl_http3, block_exploits, block_exploits_exceptions, allow_websocket_upgrade, proxy_connect/send/read_timeout, proxy_buffering (str: 'on'/'off'/''), proxy_request_buffering (str: 'on'/'off'/''), client_max_body_size (str, e.g. '10m'/'off'), proxy_max_temp_file_size (str), access_list_id, auth_provider_id, auth_bypass_paths (list[str]), ddns_enabled/provider_id/proxied, forward_container_name/network. Nullable id fields (certificate_id, access_list_id, auth_provider_id, ddns_provider_id, forward_container_name/network): empty string clears, omitted leaves unchanged; auth_bypass_paths: [] clears. REQUIRED: host_id."
  parameters: []

npg_create_proxy_host_simple:
  description: "Create a proxy host with common settings. REQUIRED: domain_names=['sub.example.com'], forward_host=IP_or_hostname, forward_port=port. Optional: forward_scheme (default 'http'), ssl_enabled (default true), ssl_forced (default true), enabled (default true), block_exploits (default true). For advanced options (WAF, caching, streaming, DDNS), use npg_create_proxy_host instead."
  parameters: []

npg_update_proxy_host_simple:
  description: "Update a proxy host with common settings (partial update — pass only the fields you want to change; omitted fields are left as-is). REQUIRED: host_id. Optional: domain_names, forward_host, forward_port, forward_scheme, enabled, ssl_forced, ssl_cert_id. For advanced options (WAF, caching, streaming, DDNS), use npg_update_proxy_host instead."
  parameters: []

npg_delete_proxy_host:
  description: "Delete a proxy host by its ID. REQUIRED: host_id."
  parameters:
    - name: host_id
      type: integer | string
      required: true

npg_test_proxy_host:
  description: "Test upstream connectivity for a proxy host. REQUIRED: host_id."
  parameters:
    - name: host_id
      type: integer | string
      required: true

npg_regenerate_config:
  description: "Regenerate nginx config for a specific proxy host without touching others. REQUIRED: host_id."
  parameters:
    - name: host_id
      type: integer | string
      required: true

npg_sync_proxy_hosts:
  description: "Sync all proxy host configs and reload nginx."
  parameters: []

npg_clone_proxy_host:
  description: "Clone a proxy host with new domain names. Returns the new proxy host. REQUIRED: host_id, domain_names."
  parameters:
    - name: host_id
      type: integer | string
      required: true
    - name: domain_names
      type: array<string>
      required: true

npg_bulk_apply_certificate:
  description: "Apply one certificate to multiple proxy hosts in a single call (loops PUT /api/v1/proxy-hosts/{id} per host — the same endpoint/field npg_update_proxy_host uses for ssl_cert_id, mapped to API field certificate_id). REQUIRED: cert_id, host_ids (list of host UUIDs, max 50). Returns a per-host result list, one entry per host: host_id + success:true + result (the PUT response), or host_id + success:false + error (why that host failed). Each host is processed independently — one failure does not abort the batch. Calls over the 50-host cap raise ValueError before any host is touched; empty host_ids are rejected with a clear error. Existing single-host tools are unchanged."
  parameters:
    - name: cert_id
      type: integer | string
      required: true
    - name: host_ids
      type: array<st> | int]
      required: true

npg_bulk_delete_proxy_hosts:
  description: "DESTRUCTIVE: delete multiple proxy hosts in a single call (loops DELETE /api/v1/proxy-hosts/{id} per host — the same endpoint npg_delete_proxy_host uses). REQUIRED: host_ids (list of host UUIDs, max 50). Returns a per-host result list, one entry per host: host_id + success:true + result, or host_id + success:false + error (why that host failed). Each host is deleted independently — one failure does not abort the batch. Deletion is permanent: sub-configs (WAF, geo, rate limit, fail2ban, challenge, etc.) cascade-delete with each host. Calls over the 50-host cap raise ValueError before any host is touched; empty host_ids are rejected with a clear error. Hidden from the standard tool tier (destructive). Existing single-host tools are unchanged."
  parameters:
    - name: host_ids
      type: array<st> | int]
      required: true

