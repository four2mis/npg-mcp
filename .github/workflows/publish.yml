name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_TAG=true
          else
            # Plain commit to main: replace/refresh the image of the LATEST
            # RELEASED version (e.g. v0.3.9 -> tags 0.3.9/0.3/latest), so a
            # fix commit ships to the existing release without a version bump.
            # Falls back to pyproject.toml if no release exists yet.
            VERSION=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName | sed 's/^v//' || true)
            if [ -z "$VERSION" ]; then
              VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            fi
            IS_TAG=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_SHORT=${VERSION%.*}" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "IS_TAG=$IS_TAG" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u four2mis --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION }} \
                       -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }} \
                       -t ghcr.io/four2mis/npg-mcp:latest .
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION }}
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }}
          docker push ghcr.io/four2mis/npg-mcp:latest

      - name: Create release (tagged releases only)
        if: env.IS_TAG == 'true'
        run: |
          gh release create ${{ env.TAG }} --title "${{ env.TAG }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
