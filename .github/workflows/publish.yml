name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: python3 -c "import ast; ast.parse(open('npg_mcp/main.py').read()); print('Syntax OK')"

      - name: Check documentation drift
        run: |
          # Verify tool-schemas.yaml, README.md, README.ko.md are in sync with main.py
          python3 << 'PYEOF'
          import re, sys

          with open('npg_mcp/main.py') as f:
              main_tools = set(re.findall(r'@mcp\.tool\(name="([^"]+)"', f.read()))

          errors = 0
          checks = [
              ('tool-schemas.yaml', r'^(npg_\w+):'),
              ('README.md', r'\|\s*`(npg_\w+)`\s*\|'),
              ('README.ko.md', r'\|\s*`(npg_\w+)`\s*\|'),
          ]
          for fname, pattern in checks:
              with open(fname) as f:
                  doc_tools = set(re.findall(pattern, f.read(), re.MULTILINE))
              missing = main_tools - doc_tools
              extra = doc_tools - main_tools
              if missing:
                  print(f'ERROR: {fname} missing {len(missing)} tools: {sorted(missing)[:5]}...')
                  errors += 1
              if extra:
                  print(f'ERROR: {fname} has {len(extra)} extra/stale tools: {sorted(extra)[:5]}...')
                  errors += 1

          if errors:
              print(f'\n{errors} file(s) out of sync. Run: regenerate_all_docs.py --write')
              sys.exit(1)
          print(f'All {len(main_tools)} tools in sync across all files')
          PYEOF

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        run: |
          TOML_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: the tag is authoritative
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_TAG=true
          else
            # Main push: pyproject.toml is the single source of truth.
            # If the version was bumped, a tag + release are created below.
            VERSION=$TOML_VERSION
            IS_TAG=false
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_SHORT=${VERSION%.*}" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "IS_TAG=$IS_TAG" >> $GITHUB_ENV

          # Does a release for this version already exist?
          if gh release view "v$VERSION" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
            echo "Version v$VERSION already released — refreshing image only."
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
            echo "Version v$VERSION is new — will create tag + release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u four2mis --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION }} \
                       -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }} \
                       -t ghcr.io/four2mis/npg-mcp:latest .
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION }}
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }}
          docker push ghcr.io/four2mis/npg-mcp:latest

      - name: Create tag and release (new version only)
        if: env.RELEASE_EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create the tag if it doesn't exist yet (main-push path).
          # On a tag push the tag already exists — skip.
          if [ "${{ env.IS_TAG }}" = "false" ] && ! git rev-parse -q --verify "refs/tags/${{ env.TAG }}" >/dev/null; then
            git tag -a "${{ env.TAG }}" -m "Release ${{ env.TAG }}"
            git push origin "${{ env.TAG }}"
            echo "Created tag ${{ env.TAG }}"
          fi

          gh release create "${{ env.TAG }}" --title "${{ env.TAG }}" --generate-notes
          echo "Created release ${{ env.TAG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
