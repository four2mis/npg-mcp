name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: python3 -c "import ast; ast.parse(open('npg_mcp/main.py').read()); print('Syntax OK')"

      - name: Run unit tests
        run: |
          python3 -m pip install --quiet . pytest respx
          python3 -m pytest tests/ -q

      - name: Check documentation drift
        run: |
          # Verify tool-schemas.yaml (full name set) and README.md/README.ko.md
          # (compact format: category counts only) are in sync with main.py
          python3 << 'PYEOF'
          import re, sys
          from collections import Counter

          with open('npg_mcp/main.py') as f:
              main_tools = set(re.findall(r'@mcp\.tool\(name="([^"]+)"', f.read()))

          errors = 0

          # 1. tool-schemas.yaml must contain every tool name
          with open('tool-schemas.yaml') as f:
              schema_tools = set(re.findall(r'^(npg_\w+):', f.read(), re.MULTILINE))
          missing = main_tools - schema_tools
          extra = schema_tools - main_tools
          if missing:
              print(f'ERROR: tool-schemas.yaml missing {len(missing)} tools: {sorted(missing)[:5]}...')
              errors += 1
          if extra:
              print(f'ERROR: tool-schemas.yaml has {len(extra)} extra/stale tools: {sorted(extra)[:5]}...')
              errors += 1
          if not missing and not extra:
              print(f'OK: tool-schemas.yaml has all {len(schema_tools)} tools')

          # 2. README.md / README.ko.md: category counts must match main.py
          #    (READMEs no longer list tool names — see regenerate_all_docs.py)
          def readme_total(path):
              with open(path) as f:
                  content = f.read()
              return sum(int(m) for m in re.findall(r'\|\s*\*\*[^*]+\*\*\s*\|\s*(\d+) tools?', content))

          # Category counts from main.py are validated by regenerate_all_docs.py;
          # here we only verify the READMEs' total tool count matches main.py.
          for fname in ('README.md', 'README.ko.md'):
              total = readme_total(fname)
              if total != len(main_tools):
                  print(f'ERROR: {fname} total tool count {total} != main.py {len(main_tools)}')
                  errors += 1
              else:
                  print(f'OK: {fname} total tool count {total} matches main.py')

          if errors:
              print(f'\n{errors} file(s) out of sync. Run: regenerate_all_docs.py --write')
              sys.exit(1)
          print(f'All {len(main_tools)} tools in sync across all files')
          PYEOF

      - name: Check tool descriptions updated with signature changes
        run: |
          # If a tool's parameter signature changed in this push, its description
          # must have changed too — otherwise the agent sees stale descriptions.
          python3 << 'PYEOF'
          import re, sys

          SIG_RE = re.compile(
              r'@mcp\.tool\(name="([^"]+)",\s*description="([^"]*)"\)\s*\n\s*async def\s+\w+\s*\(([^)]*)\)'
          )

          def extract(path):
              with open(path) as f:
                  src = f.read()
              tools = {}
              for m in SIG_RE.finditer(src):
                  name, desc, sig = m.group(1), m.group(2), re.sub(r'\s+', ' ', m.group(3)).strip()
                  tools[name] = (sig, desc)
              return tools

          try:
              current = extract('npg_mcp/main.py')
              # Compare against the previous commit (requires fetch-depth: 2)
              import subprocess
              prev_src = subprocess.run(
                  ['git', 'show', 'HEAD^:npg_mcp/main.py'],
                  capture_output=True, text=True, check=True
              ).stdout
              prev = {}
              for m in SIG_RE.finditer(prev_src):
                  name, desc, sig = m.group(1), m.group(2), re.sub(r'\s+', ' ', m.group(3)).strip()
                  prev[name] = (sig, desc)
          except subprocess.CalledProcessError:
              print('No previous commit (initial push) — skipping description check')
              sys.exit(0)

          stale = []
          for name, (sig, desc) in current.items():
              if name not in prev:
                  continue  # new tool — description is fresh by definition
              prev_sig, prev_desc = prev[name]
              if sig != prev_sig and desc == prev_desc:
                  stale.append(name)

          if stale:
              print(f'ERROR: {len(stale)} tool(s) changed signature but description was NOT updated:')
              for n in stale:
                  print(f'  - {n}')
              print('\nUpdate the description= in npg_mcp/main.py to reflect the new parameters/semantics.')
              sys.exit(1)
          print(f'All {len(current)} tool descriptions consistent with signatures')
          PYEOF

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        run: |
          TOML_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: the tag is authoritative
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_TAG=true
          else
            # Main push: pyproject.toml is the single source of truth.
            # If the version was bumped, a tag + release are created below.
            VERSION=$TOML_VERSION
            IS_TAG=false
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_SHORT=${VERSION%.*}" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "IS_TAG=$IS_TAG" >> $GITHUB_ENV

          # Does a release for this version already exist?
          if gh release view "v$VERSION" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
            echo "Version v$VERSION already released — refreshing image only."
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
            echo "Version v$VERSION is new — will create tag + release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u four2mis --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION }} \
                       -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }} \
                       -t ghcr.io/four2mis/npg-mcp:latest .
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION }}
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }}
          docker push ghcr.io/four2mis/npg-mcp:latest

      - name: Create tag and release (new version only)
        if: env.RELEASE_EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create the tag if it doesn't exist yet (main-push path).
          # On a tag push the tag already exists — skip.
          if [ "${{ env.IS_TAG }}" = "false" ] && ! git rev-parse -q --verify "refs/tags/${{ env.TAG }}" >/dev/null; then
            git tag -a "${{ env.TAG }}" -m "Release ${{ env.TAG }}"
            git push origin "${{ env.TAG }}"
            echo "Created tag ${{ env.TAG }}"
          fi

          gh release create "${{ env.TAG }}" --title "${{ env.TAG }}" --generate-notes
          echo "Created release ${{ env.TAG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
