name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: python3 -c "import ast; ast.parse(open('npg_mcp/main.py').read()); print('Syntax OK')"

      - name: Check documentation drift
        run: |
          # Verify tool-schemas.yaml, README.md, README.ko.md are in sync with main.py
          python3 << 'PYEOF'
          import re, sys

          with open('npg_mcp/main.py') as f:
              main_tools = set(re.findall(r'@mcp\.tool\(name="([^"]+)"', f.read()))

          errors = 0
          checks = [
              ('tool-schemas.yaml', r'^(npg_\w+):'),
              ('README.md', r'\|\s*`(npg_\w+)`\s*\|'),
              ('README.ko.md', r'\|\s*`(npg_\w+)`\s*\|'),
          ]
          for fname, pattern in checks:
              with open(fname) as f:
                  doc_tools = set(re.findall(pattern, f.read(), re.MULTILINE))
              missing = main_tools - doc_tools
              extra = doc_tools - main_tools
              if missing:
                  print(f'ERROR: {fname} missing {len(missing)} tools: {sorted(missing)[:5]}...')
                  errors += 1
              if extra:
                  print(f'ERROR: {fname} has {len(extra)} extra/stale tools: {sorted(extra)[:5]}...')
                  errors += 1

          if errors:
              print(f'\n{errors} file(s) out of sync. Run: regenerate_all_docs.py --write')
              sys.exit(1)
          print(f'All {len(main_tools)} tools in sync across all files')
          PYEOF

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: version comes from the tag (authoritative)
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_TAG=true
          else
            # Plain commit to main: refresh the LATEST RELEASED version's image.
            # This means a fix commit ships to the existing release without a
            # version bump. Falls back to pyproject.toml if no release exists yet.
            VERSION=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName | sed 's/^v//' || true)
            if [ -z "$VERSION" ]; then
              VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            fi
            IS_TAG=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_SHORT=${VERSION%.*}" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "IS_TAG=$IS_TAG" >> $GITHUB_ENV

          # Warn if pyproject.toml version is ahead of the release being published
          TOML_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$IS_TAG" = "false" ] && [ "$TOML_VERSION" != "$VERSION" ]; then
            echo "::warning::pyproject.toml version ($TOML_VERSION) differs from published version ($VERSION). Push a v$TOML_VERSION tag to create a new release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u four2mis --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION }} \
                       -t ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }} \
                       -t ghcr.io/four2mis/npg-mcp:latest .
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION }}
          docker push ghcr.io/four2mis/npg-mcp:${{ env.VERSION_SHORT }}
          docker push ghcr.io/four2mis/npg-mcp:latest

      - name: Create release (tagged releases only)
        if: env.IS_TAG == 'true'
        run: |
          gh release create ${{ env.TAG }} --title "${{ env.TAG }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
